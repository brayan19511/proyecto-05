services:
  rabbitmq:
    image: rabbitmq:4.2-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - finance

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Lima
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finance

  payment-provider-storage-init:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "mkdir -p /storage && chown -R 10001:10001 /storage"]
    volumes:
      - payment_provider_jobs:/storage
    networks:
      - finance

  api:
    image: ${BACKEND_IMAGE:-backend-finance:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      ENV: prod
      SQL_ECHO: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      DATA_LAKE_ROOT: /app/var/data-lake
      PAYMENT_PROVIDER_STORAGE_DIR: /app/var/payment-provider-jobs
    volumes:
      - analytics_data_lake:/app/var/data-lake
      - payment_provider_jobs:/app/var/payment-provider-jobs
    depends_on:
      payment-provider-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - finance

  worker-heavy:
    image: ${BACKEND_IMAGE:-backend-finance:latest}
    restart: unless-stopped
    mem_limit: ${WORKER_HEAVY_MEM_LIMIT:-2g}
    cpus: "${WORKER_HEAVY_CPUS:-2.0}"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      ENV: prod
      SQL_ECHO: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      DATA_LAKE_ROOT: /app/var/data-lake
      PAYMENT_PROVIDER_STORAGE_DIR: /app/var/payment-provider-jobs
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=heavy",
        "--concurrency=2",
        "--hostname=heavy@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      payment-provider-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - analytics_data_lake:/app/var/data-lake
      - payment_provider_jobs:/app/var/payment-provider-jobs
    networks:
      - finance

  worker-light:
    image: ${BACKEND_IMAGE:-backend-finance:latest}
    restart: unless-stopped
    mem_limit: ${WORKER_LIGHT_MEM_LIMIT:-1g}
    cpus: "${WORKER_LIGHT_CPUS:-2.0}"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      ENV: prod
      SQL_ECHO: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      DATA_LAKE_ROOT: /app/var/data-lake
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=light",
        "--concurrency=4",
        "--hostname=light@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - analytics_data_lake:/app/var/data-lake
    networks:
      - finance

  worker-email:
    image: ${BACKEND_IMAGE:-backend-finance:latest}
    restart: unless-stopped
    mem_limit: ${WORKER_EMAIL_MEM_LIMIT:-1g}
    cpus: "${WORKER_EMAIL_CPUS:-1.0}"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      ENV: prod
      SQL_ECHO: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      DATA_LAKE_ROOT: /app/var/data-lake
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=email",
        "--concurrency=2",
        "--hostname=email@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - analytics_data_lake:/app/var/data-lake
    networks:
      - finance

  scheduler:
    image: ${BACKEND_IMAGE:-backend-finance:latest}
    restart: unless-stopped
    mem_limit: ${SCHEDULER_MEM_LIMIT:-512m}
    cpus: "${SCHEDULER_CPUS:-0.5}"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      ENV: prod
      SQL_ECHO: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - finance

  migrate:
    image: ${BACKEND_IMAGE:-backend-finance:latest}
    restart: "no"
    profiles: ["operations"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      ENV: prod
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance

  frontend:
    image: ${FRONTEND_IMAGE:-frontend-finance:latest}
    restart: unless-stopped
    networks:
      - finance

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: America/Lima
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - finance

volumes:
  postgres_data:
  pgadmin_data:
  rabbitmq_data:
  payment_provider_jobs:
  analytics_data_lake:

networks:
  finance:
    driver: bridge
