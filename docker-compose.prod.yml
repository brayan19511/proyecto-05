services:
  rabbitmq:
    image: rabbitmq:4.2-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - finance-network

  db-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Lima
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finance-network

  api:
    image: ${BACKEND_IMAGE:-brayan1951/backend-finance:v2.1.0}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      ENV: prod
      SQL_ECHO: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - finance-network

  worker-heavy:
    image: ${BACKEND_IMAGE:-brayan1951/backend-finance:v2.1.0}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      ENV: prod
      SQL_ECHO: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=heavy",
        "--concurrency=2",
        "--hostname=heavy@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finance-network

  worker-light:
    image: ${BACKEND_IMAGE:-brayan1951/backend-finance:v2.1.0}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      ENV: prod
      SQL_ECHO: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=light",
        "--concurrency=4",
        "--hostname=light@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finance-network

  worker-email:
    image: ${BACKEND_IMAGE:-brayan1951/backend-finance:v2.1.0}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      ENV: prod
      SQL_ECHO: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=email",
        "--concurrency=2",
        "--hostname=email@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finance-network

  pg-admin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: America/Lima
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - finance-network

volumes:
  postgres-db:
  pgadmin-data:
  rabbitmq-data:

networks:
  finance-network:
    driver: bridge
