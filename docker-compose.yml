services:
  db-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Lima
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finance-network

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db-postgres
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN}
      DB_SAP_USER: ${DB_SAP_USER}
      DB_SAP_PASSWORD: ${DB_SAP_PASSWORD}
      DB_SAP_HOST: ${DB_SAP_HOST}
      DB_SAP_PORT: ${DB_SAP_PORT}
      SAP_URL: ${SAP_URL}
      DB_OFISIS_PORT: ${DB_OFISIS_PORT:-1433}
      DB_OFISIS_HOST: ${DB_OFISIS_HOST}
      DB_OFISIS_USER: ${DB_OFISIS_USER}
      DB_OFISIS_PASSWORD: ${DB_OFISIS_PASSWORD}
      DB_OFISIS_DRIVER: ${DB_OFISIS_DRIVER:-ODBC Driver 17 for SQL Server}
      DB_OFISIS_ENCRYPT: ${DB_OFISIS_ENCRYPT:-false}
      DB_OFISIS_TRUST_SERVER_CERTIFICATE: ${DB_OFISIS_TRUST_SERVER_CERTIFICATE:-false}
      DB_OFISIS_ECOMM_DATABASE: ${DB_OFISIS_ECOMM_DATABASE:-EcommDB}
      DB_CIC_HOST: ${DB_CIC_HOST}
      DB_CIC_PORT: ${DB_CIC_PORT:-1433}
      DB_CIC_USER: ${DB_CIC_USER}
      DB_CIC_PASSWORD: ${DB_CIC_PASSWORD}
      DB_CIC_DRIVER: ${DB_CIC_DRIVER:-ODBC Driver 17 for SQL Server}
      DB_CIC_ENCRYPT: ${DB_CIC_ENCRYPT:-false}
      DB_CIC_TRUST_SERVER_CERTIFICATE: ${DB_CIC_TRUST_SERVER_CERTIFICATE:-false}
      DB_CIC_DATABASE: ${DB_CIC_DATABASE:-dbcoolbox}



      ENV: ${ENV}
      PROJECT_NAME: ${PROJECT_NAME}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      SQL_ECHO: ${SQL_ECHO:-false}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - finance-network

  pg-admin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: America/Lima
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      db-postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - finance-network

volumes:
  postgres-db:
  pgadmin-data:

networks:
  finance-network:
    driver: bridge
