services:
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-finance}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-finance}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - finance-network

  db-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Lima
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finance-network

  payment-provider-storage-init:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "mkdir -p /storage && chown -R 10001:10001 /storage"]
    volumes:
      - payment-provider-jobs:/storage
    networks:
      - finance-network

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - payment-provider-jobs:/app/var/payment-provider-jobs
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//}
      PAYMENT_PROVIDER_STORAGE_DIR: ${PAYMENT_PROVIDER_STORAGE_DIR:-/app/var/payment-provider-jobs}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      payment-provider-storage-init:
        condition: service_completed_successfully
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finance-network

  worker-heavy:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=heavy",
        "--concurrency=2",
        "--hostname=heavy@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - finance-network

  worker-light:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=light",
        "--concurrency=4",
        "--hostname=light@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - finance-network

  worker-email:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//}
      PAYMENT_PROVIDER_STORAGE_DIR: ${PAYMENT_PROVIDER_STORAGE_DIR:-/app/var/payment-provider-jobs}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=email",
        "--concurrency=2",
        "--hostname=email@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      payment-provider-storage-init:
        condition: service_completed_successfully
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - payment-provider-jobs:/app/var/payment-provider-jobs
    networks:
      - finance-network

  pg-admin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: America/Lima
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      db-postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - finance-network

volumes:
  postgres-db:
  pgadmin-data:
  rabbitmq-data:
  payment-provider-jobs:

networks:
  finance-network:
    driver: bridge
