services:
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-finance}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-finance}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - finance-network

  db-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Lima
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finance-network

  payment-provider-storage-init:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "mkdir -p /storage && chown -R 10001:10001 /storage"]
    volumes:
      - payment-provider-jobs:/storage
    networks:
      - finance-network

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    volumes:
      - .:/app
      - payment-provider-jobs:/app/var/payment-provider-jobs
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db-postgres
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN}
      DB_SAP_USER: ${DB_SAP_USER}
      DB_SAP_PASSWORD: ${DB_SAP_PASSWORD}
      DB_SAP_HOST: ${DB_SAP_HOST}
      DB_SAP_PORT: ${DB_SAP_PORT}
      SAP_URL: ${SAP_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//}
      DB_OFISIS_PORT: ${DB_OFISIS_PORT:-1433}
      DB_OFISIS_HOST: ${DB_OFISIS_HOST}
      DB_OFISIS_USER: ${DB_OFISIS_USER}
      DB_OFISIS_PASSWORD: ${DB_OFISIS_PASSWORD}
      DB_OFISIS_DRIVER: ${DB_OFISIS_DRIVER:-ODBC Driver 17 for SQL Server}
      DB_OFISIS_ENCRYPT: ${DB_OFISIS_ENCRYPT:-false}
      DB_OFISIS_TRUST_SERVER_CERTIFICATE: ${DB_OFISIS_TRUST_SERVER_CERTIFICATE:-false}
      DB_OFISIS_ECOMM_DATABASE: ${DB_OFISIS_ECOMM_DATABASE:-EcommDB}
      DB_CIC_HOST: ${DB_CIC_HOST}
      DB_CIC_PORT: ${DB_CIC_PORT:-1433}
      DB_CIC_USER: ${DB_CIC_USER}
      DB_CIC_PASSWORD: ${DB_CIC_PASSWORD}
      DB_CIC_DRIVER: ${DB_CIC_DRIVER:-ODBC Driver 17 for SQL Server}
      DB_CIC_ENCRYPT: ${DB_CIC_ENCRYPT:-false}
      DB_CIC_TRUST_SERVER_CERTIFICATE: ${DB_CIC_TRUST_SERVER_CERTIFICATE:-false}
      DB_CIC_DATABASE: ${DB_CIC_DATABASE:-dbcoolbox}
      SMTP_HOST: ${SMTP_HOST:-192.168.30.199}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-no-reply@coolbox.com.pe}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@coolbox.com.pe}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Coolbox}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      EMAIL_TEMPLATE_DIR: ${EMAIL_TEMPLATE_DIR:-app/templates/emails}
      PAYMENT_PROVIDER_STORAGE_DIR: ${PAYMENT_PROVIDER_STORAGE_DIR:-/app/var/payment-provider-jobs}
      PAYMENT_PROVIDER_ENABLE_OCR: ${PAYMENT_PROVIDER_ENABLE_OCR:-true}
      PAYMENT_PROVIDER_OCR_LANG: ${PAYMENT_PROVIDER_OCR_LANG:-spa}
      PAYMENT_PROVIDER_OCR_DPI: ${PAYMENT_PROVIDER_OCR_DPI:-250}
      PAYMENT_PROVIDER_MIN_TEXT_LENGTH: ${PAYMENT_PROVIDER_MIN_TEXT_LENGTH:-80}
      ENV: ${ENV}
      PROJECT_NAME: ${PROJECT_NAME}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      SQL_ECHO: ${SQL_ECHO:-false}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      payment-provider-storage-init:
        condition: service_completed_successfully
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finance-network

  worker-sap:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=sap",
        "--concurrency=4",
        "--hostname=sap@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - finance-network

  worker-email:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//}
      PAYMENT_PROVIDER_STORAGE_DIR: ${PAYMENT_PROVIDER_STORAGE_DIR:-/app/var/payment-provider-jobs}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=email",
        "--concurrency=2",
        "--hostname=email@%h",
      ]
    healthcheck:
      disable: true
    depends_on:
      payment-provider-storage-init:
        condition: service_completed_successfully
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - payment-provider-jobs:/app/var/payment-provider-jobs
    networks:
      - finance-network

  pg-admin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: America/Lima
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      db-postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - finance-network

volumes:
  postgres-db:
  pgadmin-data:
  rabbitmq-data:
  payment-provider-jobs:

networks:
  finance-network:
    driver: bridge
