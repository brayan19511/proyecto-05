{% extends "base.html" %} {% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0 p-4 text-center">
        <div class="card-body">
          <i
            class="bi bi-file-earmark-excel text-success"
            style="font-size: 4rem"
          ></i>
          <h3 class="card-title mt-3 fw-bold">Exportar Libro Mayor</h3>
          <p class="text-muted">
            Descarga la información reclasificada en formato Excel (.xlsx) listo
            para usar en tus reportes financieros o Power BI.
          </p>

          <form
            id="exportForm"
            action="/api/libro-mayor/export-excel"
            method="GET"
            class="mt-4 text-start"
          >
            <div class="mb-3">
              <label class="form-label">Fecha Inicio</label>
              <input
                type="date"
                class="form-control"
                id="start_date"
                name="start_date"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Fecha Fin</label>
              <input
                type="date"
                class="form-control"
                id="end_date"
                name="end_date"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Cuenta</label>
              <select class="form-select" id="account" name="account" required>
                <option value="">Seleccione...</option>
                <option value="95">95 - Gasto de Ventas</option>
                <option value="97">97 - Gasto Administrativos</option>
              </select>
            </div>

            <div id="error-message" class="alert alert-danger d-none"></div>

            <button id="btnExport" type="submit" class="btn btn-success w-100">
              <i class="bi bi-download me-2"></i>
              Descargar Archivo Excel
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  document
    .getElementById("exportForm")
    .addEventListener("submit", function (e) {
      const startDate = document.getElementById("start_date").value;

      const endDate = document.getElementById("end_date").value;

      const errorDiv = document.getElementById("error-message");

      errorDiv.classList.add("d-none");

      if (!startDate || !endDate) {
        e.preventDefault();

        errorDiv.textContent =
          "Debe seleccionar una fecha inicio y una fecha fin.";

        errorDiv.classList.remove("d-none");
        return;
      }

      if (new Date(endDate) < new Date(startDate)) {
        e.preventDefault();

        errorDiv.textContent =
          "La fecha fin no puede ser menor a la fecha inicio.";

        errorDiv.classList.remove("d-none");
        return;
      }
    });
</script>

{% endblock %}
