<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Financiero - SAP B1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background-color: #f8f9fa; }
        .sidebar { background-color: #212529; min-width: 240px; min-height: 100vh; color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,0.75); }
        .sidebar .nav-link.active { color: #fff; background-color: #0d6efd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="d-flex">
        <div class="sidebar p-3 d-flex flex-column">
            <h5 class="py-2 border-bottom text-center text-truncate"><i class="bi bi-graph-up-arrow text-primary"></i> Libro Mayor</h5>
            <ul class="nav nav-pills flex-column mb-auto mt-3">
                <!-- <li class="nav-item">
                    <a href="/api/web/reglas" class="nav-link {% if active_page == 'reglas' %}active{% endif %}">
                        <i class="bi bi-gavel me-2"></i> Reglas de Gasto
                    </a>
                </li> -->
                <li>
                    <a href="/api/web/libro-mayor" class="nav-link {% if active_page == 'libro-mayor' %}active{% endif %}">
                        <i class="bi me-2"></i> Descargar libro-mayor
                    </a>
                </li>
            </ul>
            <div class="text-muted text-center small border-top pt-2">v1.0.0</div>
        </div>

        <div class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
