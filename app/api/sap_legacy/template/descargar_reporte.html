{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-4 text-center">
                <div class="card-body">
                    <i class="bi bi-file-earmark-excel text-success" style="font-size: 4rem;"></i>
                    <h3 class="card-title mt-3 fw-bold">Exportar Libro Mayor</h3>
                    <p class="text-muted">Descarga la información reclasificada en formato Excel (.xlsx) listo para usar en tus reportes financieros o Power BI.</p>
                    
                    <form action="/api/sap/finance/libro-mayor/exportar-excel" method="GET" class="mt-4 text-start">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha Inicio (Opcional)</label>
                            <input type="date" class="form-control" name="fecha_inicio">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Fecha Fin (Opcional)</label>
                            <input type="date" class="form-control" name="fecha_fin">
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2fw-bold">
                            <i class="bi bi-download me-2"></i> Descargar Archivo Excel
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
